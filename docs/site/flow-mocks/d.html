<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flow mock D: orbit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="shared.css" />
    <style>
      .stage { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 2rem; width: min(70rem, 95vw); padding-top: 0.5rem; }
      .orbit { position: relative; width: min(100%, 26rem); aspect-ratio: 1; margin: 0 auto; }
      .orbit .ring { position: absolute; inset: 0; border-radius: 50%; border: 1px dashed rgb(255 231 176 / 0.25); }
      .orbit .centre { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 5.2rem; height: 5.2rem; }
      .orbit .centre svg { width: 2.6rem; height: 2.6rem; }
      .spoke { position: absolute; left: 50%; top: 50%; height: 2px; width: 50%; transform-origin: 0 50%; background: rgb(255 231 176 / 0.22); }
      .spoke .pulse { position: absolute; top: 50%; left: 0; width: 0.8rem; height: 0.8rem; margin: -0.4rem 0 0 -0.4rem; border-radius: 50%; background: var(--chip); box-shadow: 0 0 1rem 0.25rem rgb(63 214 196 / 0.7); opacity: 0; transition: left 1s cubic-bezier(0.45, 0, 0.55, 1), opacity 0.3s; }
      .spoke .pulse.no { background: var(--no); box-shadow: 0 0 1rem 0.25rem rgb(255 138 128 / 0.6); }
      .sat { position: absolute; left: 50%; top: 50%; display: grid; justify-items: center; gap: 0.4rem; translate: -50% -50%; }
      .caption { min-height: 7rem; }
      .caption .step { font: 700 clamp(1.4rem, 2.4vw, 2rem) / 1.15 var(--display); margin: 0 0 0.5rem; letter-spacing: -0.01em; text-wrap: balance; }
      .caption .detail { margin: 0; color: var(--soft); font-size: 1.05rem; max-width: 28rem; }
      .caption .who { font: 600 0.9rem/1 var(--body); color: var(--chip); margin: 0 0 0.75rem; }
      @media (max-width: 48rem) { .stage { grid-template-columns: 1fr; text-align: center; } .caption .detail { margin-inline: auto; } .orbit { width: min(100%, 20rem); } .mark { width: 2.8rem; height: 2.8rem; } }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="orbit" id="orbit"><div class="ring"></div></div>
      <div class="caption"><p class="who" id="who">&nbsp;</p><p class="step" id="step">&nbsp;</p><p class="detail" id="detail">&nbsp;</p></div>
    </div>
    <script type="module">
      import { ICONS, STOPS, shell, reduced } from './shared.js'
      shell('D')
      const orbit = document.getElementById('orbit')
      const sats = { you: 200, zg: 320, world: 20, arc: 70, gate: 130 } // degrees around the robot
      const R = 50 // percent of the box
      const pos = (deg) => { const r = (deg * Math.PI) / 180; return { x: 50 + R * Math.cos(r), y: 50 + R * Math.sin(r) } }
      orbit.insertAdjacentHTML('beforeend', Object.entries(sats).map(([id, deg]) => `<div class="spoke" id="spoke-${id}" style="transform: rotate(${deg}deg)"><span class="pulse"></span></div>`).join(''))
      orbit.insertAdjacentHTML('beforeend', `<div class="mark centre" id="mark-robot">${ICONS.robot}</div>`)
      orbit.insertAdjacentHTML('beforeend', Object.entries(sats).map(([id, deg]) => { const p = pos(deg); const s = STOPS.find((x) => x.id === id); return `<div class="sat" style="left:${p.x}%; top:${p.y}%"><span class="mark" id="mark-${id}">${ICONS[id]}</span><span class="name">${s.name}</span></div>` }).join(''))
      const who = document.getElementById('who'), step = document.getElementById('step'), detail = document.getElementById('detail')
      // Each hop: between the robot and one satellite, out or in, with what it means.
      const hops = [
        ['you', 'in', 'You', 'A budget, with one passkey signature', '3.00 a day, 1.00 a go, Duck Café only. The money stays in your wallet; the rules go to Arc.'],
        ['gate', 'in', 'Gate', 'The till hands over an invoice', 'Chai, 0.10 USDC, as an x402 invoice.'],
        ['zg', 'out', '0G', 'The robot asks its brain', 'Facts only: the item, the price, the budget, the policy.'],
        ['zg', 'in', '0G', 'Decides: buy', 'Logged with a request id; the whole errand lands on 0G Storage.'],
        ['arc', 'out', 'Arc', 'The chip signs; Arc checks the caps', 'Settled in USDC in half a second, on mainnet.'],
        ['gate', 'out', 'Gate', 'A signed "paid": the gate opens', ''],
        ['gate', 'in', 'Gate', 'Next invoice: a thali, 2.00', ''],
        ['zg', 'out', '0G', 'The robot asks its brain', ''],
        ['zg', 'in', '0G', 'Decides: ask you', 'It\'s over the 1.00 per-payment cap.'],
        ['you', 'out', 'You', 'Your phone asks', ''],
        ['world', 'out', 'World', 'A fresh World ID check', 'Bound to this exact payment. Say no and nothing is signed.'],
        ['world', 'in', 'World', 'Approved by a verified human', 'The backend co-signs this one payment.'],
        ['arc', 'out', 'Arc', 'Arc checks the approval and settles', ''],
        ['gate', 'out', 'Gate', 'The gate opens', ''],
        ['you', 'in', 'You', 'You switch it off', 'One passkey signature revokes the budget on Arc.'],
        ['arc', 'out', 'Arc', 'The next payment is refused by Arc itself', 'Not even our servers could override that.', 'no'],
      ]
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
      const run = async () => {
        for (;;) {
          for (const [id, dir, name, title, text, kind] of hops) {
            const pulse = document.querySelector(`#spoke-${id} .pulse`)
            const mark = document.getElementById(`mark-${id}`), robot = document.getElementById('mark-robot')
            pulse.classList.toggle('no', kind === 'no')
            pulse.style.transition = 'none'; pulse.style.left = dir === 'out' ? '0%' : '100%'; pulse.style.opacity = '1'
            void pulse.offsetWidth; pulse.style.transition = ''
            ;(dir === 'out' ? robot : mark).classList.add('on')
            who.textContent = name; step.textContent = title; detail.textContent = text || ' '
            await sleep(reduced ? 0 : 60)
            pulse.style.left = dir === 'out' ? '100%' : '0%'
            await sleep(reduced ? 0 : 1000)
            ;(dir === 'out' ? mark : robot).classList.add(kind === 'no' ? 'no' : 'on')
            pulse.style.opacity = '0'
            await sleep(text ? 1900 : 1100)
            document.querySelectorAll('.mark').forEach((m) => m.classList.remove('on', 'no'))
          }
          await sleep(1200)
        }
      }
      run()
    </script>
  </body>
</html>
