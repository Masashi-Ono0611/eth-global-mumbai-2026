<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flow mock D2: orbit (refined)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="shared.css" />
    <style>
      .words { padding-top: clamp(1.5rem, 6vh, 4rem); padding-bottom: 0; }
      .stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; gap: clamp(1rem, 4vw, 4rem); width: min(72rem, 95vw); padding-top: 0; }
      .ticket { grid-column: 1 / -1; display: flex; justify-content: center; gap: 0.75rem; margin: 0 0 0.5rem; }
      .ticket span { font: 600 0.95rem/1 var(--body); padding: 0.55rem 0.9rem; border-radius: 999px; background: rgb(255 248 234 / 0.1); color: var(--soft); }
      .ticket .item { background: rgb(255 231 176 / 0.16); color: var(--paper); }
      .orbit { position: relative; width: min(100%, 24rem); aspect-ratio: 1; margin: 0 auto; }
      .orbit .ring { position: absolute; inset: 0; border-radius: 50%; border: 1px dashed rgb(255 231 176 / 0.22); }
      .orbit .centre { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 5.6rem; height: 5.6rem; }
      .orbit .centre svg { width: 2.8rem; height: 2.8rem; }
      .spoke { position: absolute; left: 50%; top: 50%; height: 2px; width: 50%; transform-origin: 0 50%; background: rgb(255 231 176 / 0.2); transition: background 0.4s; }
      .spoke.lit { background: linear-gradient(90deg, rgb(63 214 196 / 0.9), rgb(63 214 196 / 0.25)); }
      .spoke.lit.in { background: linear-gradient(90deg, rgb(63 214 196 / 0.25), rgb(63 214 196 / 0.9)); }
      .spoke.lit.no { background: linear-gradient(90deg, rgb(255 138 128 / 0.9), rgb(255 138 128 / 0.25)); }
      .spoke .pulse { position: absolute; top: 50%; left: 0; width: 1rem; height: 1rem; margin: -0.5rem 0 0 -0.5rem; border-radius: 50%; background: var(--chip); box-shadow: 0 0 1.2rem 0.35rem rgb(63 214 196 / 0.75); opacity: 0; transition: left 1s cubic-bezier(0.45, 0, 0.55, 1), opacity 0.3s; }
      .spoke .pulse.no { background: var(--no); box-shadow: 0 0 1.2rem 0.35rem rgb(255 138 128 / 0.6); }
      .sat { position: absolute; left: 50%; top: 50%; display: grid; justify-items: center; gap: 0.4rem; translate: -50% -50%; }
      .sat .mark { width: 3.6rem; height: 3.6rem; } .sat .mark svg { width: 1.8rem; height: 1.8rem; }
      .caption { min-height: 9rem; }
      .caption .who { font: 600 0.95rem/1 var(--body); color: var(--chip); margin: 0 0 0.6rem; transition: color 0.3s; }
      .caption .who.no { color: var(--no); }
      .caption .step { font: 700 clamp(1.5rem, 2.6vw, 2.3rem) / 1.12 var(--display); margin: 0 0 0.6rem; letter-spacing: -0.015em; text-wrap: balance; }
      .caption .detail { margin: 0; color: var(--soft); font-size: clamp(1rem, 1.3vw, 1.15rem); max-width: 30rem; text-wrap: pretty; }
      .caption .inner { opacity: 0; transform: translateY(0.3rem); transition: opacity 0.3s, transform 0.3s; }
      .caption .inner.show { opacity: 1; transform: none; }
      @media (max-width: 48rem) { .stage { grid-template-columns: 1fr; text-align: center; } .caption .detail { margin-inline: auto; } .orbit { width: min(100%, 19rem); } .sat .mark { width: 2.8rem; height: 2.8rem; } .sat .mark svg { width: 1.4rem; height: 1.4rem; } .orbit .centre { width: 4.4rem; height: 4.4rem; } .caption { min-height: 7rem; } }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="ticket"><span class="item" id="item"></span><span id="spent"></span></div>
      <div class="orbit" id="orbit"><div class="ring"></div></div>
      <div class="caption"><div class="inner" id="inner"><p class="who" id="who">&nbsp;</p><p class="step" id="step">&nbsp;</p><p class="detail" id="detail">&nbsp;</p></div></div>
    </div>
    <script type="module">
      import { ICONS, STOPS, shell, reduced } from './shared.js'
      shell('D2')
      const orbit = document.getElementById('orbit')
      // Clockwise in the order of a payment, starting at the top.
      const sats = { you: -90, zg: -18, world: 54, arc: 126, store: 198 }
      const pos = (deg) => { const r = (deg * Math.PI) / 180; return { x: 50 + 50 * Math.cos(r), y: 50 + 50 * Math.sin(r) } }
      orbit.insertAdjacentHTML('beforeend', Object.entries(sats).map(([id, deg]) => `<div class="spoke" id="spoke-${id}" style="transform: rotate(${deg}deg)"><span class="pulse"></span></div>`).join(''))
      orbit.insertAdjacentHTML('beforeend', `<div class="mark centre" id="mark-robot">${ICONS.robot}</div>`)
      orbit.insertAdjacentHTML('beforeend', Object.entries(sats).map(([id, deg]) => { const p = pos(deg); const s = STOPS.find((x) => x.id === id); return `<div class="sat" style="left:${p.x}%; top:${p.y}%"><span class="mark" id="mark-${id}">${ICONS[id]}</span><span class="name">${s.name}</span></div>` }).join(''))
      const $ = (id) => document.getElementById(id)
      const [who, step, detail, inner, item, spent] = ['who', 'step', 'detail', 'inner', 'item', 'spent'].map($)
      // Each scenario: a ticket, then hops between the robot and one stop, out or in, in plain words.
      const scenarios = [
        { item: '<b>Chai</b> · 0.10 USDC · Duck Café', spent: 'Budget: 3.00 a day, 1.00 a go', hops: [
          ['you', 'in', 'You set the budget', '3.00 a day, 1.00 a go, Duck Café only. One tap; the money stays in your wallet.'],
          ['store', 'in', 'The stall hands over the bill', 'Chai, 0.10 USDC.'],
          ['zg', 'out', 'The robot asks its brain', 'Just the facts: what, how much, where, and the budget.'],
          ['zg', 'in', 'Buy', 'Within the budget, right place. The brain remembers every errand.'],
          ['arc', 'out', 'The robot signs; Arc checks the rules', 'And moves 0.10 USDC. Half a second.'],
          ['store', 'out', 'The stall sees "paid"', 'And opens its gate.'],
        ] },
        { item: '<b>Thali</b> · 2.00 USDC · Duck Café', spent: 'Spent today: 0.10 of 3.00', hops: [
          ['store', 'in', 'Next bill: a thali, 2.00', ''],
          ['zg', 'out', 'The robot asks its brain', ''],
          ['zg', 'in', 'Ask the owner', 'It\'s over the 1.00 limit for one payment.'],
          ['you', 'out', 'Your phone asks', 'You say yes.'],
          ['world', 'out', 'World checks it\'s really you', 'For this exact payment. Say no and nothing is paid.'],
          ['world', 'in', 'A real person said yes', ''],
          ['arc', 'out', 'Arc sees your yes and moves 2.00 USDC', ''],
          ['store', 'out', 'The gate opens', ''],
        ] },
        { item: '<b>Off switch</b>', spent: 'Spent today: 2.10 of 3.00', hops: [
          ['you', 'in', 'You switch the robot off', 'One tap. Arc locks the budget.'],
          ['arc', 'out', 'Next chai? Refused by Arc itself', 'Not even we could change that.', 'no'],
        ] },
      ]
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
      const run = async () => {
        for (;;) {
          for (const sc of scenarios) {
            item.innerHTML = sc.item; spent.textContent = sc.spent
            for (const [id, dir, title, text, kind] of sc.hops) {
              const spoke = $(`spoke-${id}`), pulse = spoke.querySelector('.pulse')
              const mark = $(`mark-${id}`), robot = $('mark-robot')
              pulse.classList.toggle('no', kind === 'no')
              pulse.style.transition = 'none'; pulse.style.left = dir === 'out' ? '0%' : '100%'; pulse.style.opacity = '1'
              void pulse.offsetWidth; pulse.style.transition = ''
              spoke.className = `spoke lit ${dir} ${kind ?? ''}`
              ;(dir === 'out' ? robot : mark).classList.add('on')
              inner.classList.remove('show')
              await sleep(reduced ? 0 : 60)
              pulse.style.left = dir === 'out' ? '100%' : '0%'
              await sleep(reduced ? 0 : 1000)
              ;(dir === 'out' ? mark : robot).classList.add(kind === 'no' ? 'no' : 'on')
              pulse.style.opacity = '0'
              who.textContent = STOPS.find((s) => s.id === id).name; who.className = `who ${kind ?? ''}`
              step.textContent = title; detail.textContent = text || ' '
              inner.classList.add('show')
              await sleep(text ? 2300 : 1400)
              document.querySelectorAll('.mark').forEach((m) => m.classList.remove('on', 'no'))
              spoke.className = 'spoke'
            }
            inner.classList.remove('show')
            await sleep(1000)
          }
        }
      }
      run()
    </script>
  </body>
</html>
