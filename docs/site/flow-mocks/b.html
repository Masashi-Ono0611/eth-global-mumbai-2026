<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flow mock B: three layers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="shared.css" />
    <style>
      .stage { padding-top: 0.5rem; padding-bottom: 1.5rem; }
      .words { padding-top: clamp(1.5rem, 5vh, 3rem); padding-bottom: 0; }
      svg.layers { width: 100%; height: auto; max-height: 56svh; display: block; margin: 0 auto; overflow: visible; }
      .layer { fill: rgb(255 248 234 / 0.05); stroke: rgb(255 231 176 / 0.25); stroke-width: 1; rx: 18; }
      .layer-name { fill: var(--faint); font: 600 13px var(--body); letter-spacing: 0.02em; }
      .node circle { fill: var(--night); stroke: rgb(255 231 176 / 0.6); stroke-width: 2; }
      .node { color: var(--lamp); }
      .node .label { fill: var(--lamp); font: 700 15px var(--body); text-anchor: middle; }
      .node .does { fill: var(--soft); font: 400 12px var(--body); text-anchor: middle; }
      .edge { fill: none; stroke: rgb(255 231 176 / 0.28); stroke-width: 1.5; stroke-dasharray: 3 5; }
      .edge-label { fill: var(--soft); font: 600 11px var(--body); text-anchor: middle; paint-order: stroke; stroke: var(--night); stroke-width: 4px; stroke-linejoin: round; }
      .packet { fill: var(--chip); filter: drop-shadow(0 0 6px rgb(63 214 196 / 0.9)); }
      .packet.human { fill: var(--lamp); filter: drop-shadow(0 0 6px rgb(255 231 176 / 0.9)); }
      .words { padding-bottom: 0; }
    </style>
  </head>
  <body>
    <div class="stage">
      <svg class="layers" viewBox="0 0 1000 430" aria-label="How a payment moves between the devices you hold, the public networks and the shop">
        <rect class="layer" x="20" y="14" width="960" height="120" /><text class="layer-name" x="40" y="38">ON DEVICES YOU HOLD</text>
        <rect class="layer" x="20" y="160" width="960" height="140" /><text class="layer-name" x="40" y="184">ON PUBLIC NETWORKS</text>
        <rect class="layer" x="20" y="326" width="960" height="94" /><text class="layer-name" x="40" y="350">AT THE SHOP</text>
        <g id="edges"></g>
        <g id="nodes"></g>
        <g id="packets"></g>
      </svg>
    </div>
    <script type="module">
      import { ICONS, shell, reduced } from './shared.js'
      shell('B')
      const N = {
        you: { x: 300, y: 80, name: 'You', does: ['a passkey: grants, approves,', 'revokes'] },
        robot: { x: 700, y: 80, name: 'Robot', does: ['its own chip key signs', 'every payment'] },
        arc: { x: 300, y: 232, name: 'Arc mainnet', does: ['the budget as a contract;', 'USDC settles in 0.5 s'] },
        zg: { x: 500, y: 232, name: '0G', does: ['decides buy / ask / walk;', 'keeps every errand'] },
        world: { x: 740, y: 232, name: 'World', does: ['a fresh human yes,', 'per payment'] },
        store: { x: 700, y: 378, name: 'Store', does: ['hands over the bill;', 'opens on "paid"'] },
      }
      const icon = (id, x, y, size) => ICONS[id].replace('<svg ', `<svg x="${x - size / 2}" y="${y - size / 2}" width="${size}" height="${size}" `)
      document.getElementById('nodes').innerHTML = Object.entries(N).map(([id, n]) => `
        <g class="node"><circle cx="${n.x}" cy="${n.y}" r="24" />${icon(id, n.x, n.y, 26)}
          <text class="label" x="${n.x}" y="${n.y + 44}">${n.name}</text>
          <text class="does" x="${n.x}" y="${n.y + 60}">${n.does[0]}</text><text class="does" x="${n.x}" y="${n.y + 74}">${n.does[1]}</text></g>`).join('')
      // Edges as curves; a packet follows each in turn. 'human' packets are the owner's own actions.
      const curve = (a, b, bend = 0) => { const A = N[a], B = N[b]; const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2; return `M${A.x} ${A.y} Q${mx + bend} ${my} ${B.x} ${B.y}` }
      const E = [
        { id: 'grant', d: curve('you', 'arc', -60), label: 'budget granted', kind: 'human', dur: 1.6 },
        { id: 'ask', d: curve('robot', 'zg', -40), label: 'decide?', dur: 1.3 },
        { id: 'answer', d: curve('zg', 'robot', 40), label: 'buy', dur: 1.3 },
        { id: 'sign', d: curve('robot', 'arc', -130), label: 'signed payment', dur: 1.8 },
        { id: 'paid', d: curve('arc', 'store', 120), label: 'paid', dur: 1.8 },
        { id: 'asks', d: curve('zg', 'you', -40), label: 'over the cap: ask you', dur: 1.5 },
        { id: 'yes', d: curve('you', 'world', -120), label: 'yes, with World ID', kind: 'human', dur: 1.8 },
        { id: 'approval', d: curve('world', 'arc', 90), label: 'approval, bound to this payment', dur: 1.6 },
        { id: 'paid2', d: curve('arc', 'store', 120), label: '', dur: 1.8 },
      ]
      document.getElementById('edges').innerHTML = E.filter((e) => e.id !== 'paid2').map((e) => `<path id="e-${e.id}" class="edge" d="${e.d}" />`).join('') +
        E.filter((e) => e.label && e.id !== 'paid2').map((e) => `<text class="edge-label" dy="-6"><textPath href="#e-${e.id}" startOffset="50%">${e.label}</textPath></text>`).join('')
      // One packet per hop, chained with SMIL so the loop stays in step; a pause separates the chai from the thali.
      const gap = 0.5
      document.getElementById('packets').innerHTML = E.map((e, i) => {
        const prev = i === 0 ? `0s; p${E.length - 1}.end+1.5s` : `p${i - 1}.end+${i === 5 ? 1.5 : gap}s`
        return `<circle class="packet ${e.kind ?? ''}" r="7" opacity="0"><animateMotion id="p${i}" dur="${e.dur}s" begin="${prev}" fill="freeze" path="${e.d}" calcMode="spline" keySplines="0.45 0 0.55 1" keyTimes="0;1" keyPoints="0;1" /><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="${e.dur}s" begin="${prev}" fill="freeze" /></circle>`
      }).join('')
      if (reduced) document.querySelector('svg.layers').pauseAnimations()
    </script>
  </body>
</html>
