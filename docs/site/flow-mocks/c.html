<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flow mock C: the live receipt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="shared.css" />
    <style>
      .stage { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: 1.25rem; align-items: start; width: min(74rem, 95vw); padding-top: 1rem; }
      .receipt { background: var(--paper); color: var(--night); border-radius: 1rem; padding: 1.1rem 1.25rem 1.25rem; box-shadow: 0 1.5rem 3rem rgb(0 0 0 / 0.35); min-height: 19rem; transition: opacity 0.5s; }
      .receipt header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px dashed rgb(22 23 58 / 0.2); padding-bottom: 0.6rem; margin-bottom: 0.4rem; }
      .receipt h2 { margin: 0; font: 700 1.25rem/1.1 var(--display); }
      .receipt header span { font: 600 0.85rem/1 var(--body); color: #556; }
      .receipt ol { list-style: none; margin: 0; padding: 0; }
      .receipt li { display: grid; grid-template-columns: 2rem 1fr auto; gap: 0.6rem; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid rgb(22 23 58 / 0.08); opacity: 0; transform: translateY(0.4rem); transition: opacity 0.4s, transform 0.4s; }
      .receipt li.show { opacity: 1; transform: none; }
      .receipt li .ic { width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; background: var(--night); color: var(--lamp); }
      .receipt li .ic svg { width: 1.1rem; height: 1.1rem; }
      .receipt li .ic.no { background: var(--no); color: var(--night); }
      .receipt li .what { font: 600 0.98rem/1.25 var(--body); }
      .receipt li .what small { display: block; font-weight: 400; color: #556; font-size: 0.82rem; }
      .receipt li .val { font: 700 0.95rem/1 var(--display); white-space: nowrap; color: #1b8550; }
      .receipt li .val.no { color: #b9433a; }
      .receipt li .val.muted { color: #556; font-weight: 500; }
      .receipt footer { margin-top: 0.75rem; display: flex; justify-content: space-between; font: 600 0.85rem/1 var(--body); color: #556; }
      .receipt footer b { color: var(--night); }
      @media (max-width: 40rem) { .receipt { min-height: 0; } }
    </style>
  </head>
  <body>
    <div class="stage" id="stage"></div>
    <script type="module">
      import { ICONS, shell, reduced } from './shared.js'
      shell('C')
      const line = (id, what, sub, val, cls = '') => ({ id, what, sub, val, cls })
      const receipts = [
        { title: 'Chai', amount: '0.10 USDC', total: 'Spent today <b>0.10</b> of 3.00', lines: [
          line('store', 'The bill from the stall', 'Duck Café · 7asbeh…', '0.10'),
          line('zg', '0G decided: buy', 'within budget · request id 5ca4a212…', 'ok'),
          line('robot', 'The chip signed', 'the robot\'s own key, on the robot', 'ok'),
          line('arc', 'Settled on Arc mainnet', 'tx 0xa18da6c6…814a · 0.5 s', '0.10'),
          line('store', 'Store', 'saw a signed "paid": gate open', 'OPEN'),
        ] },
        { title: 'Thali', amount: '2.00 USDC', total: 'Spent today <b>2.10</b> of 3.00', lines: [
          line('store', 'The bill from the stall', 'Duck Café · thali', '2.00'),
          line('zg', '0G decided: ask you', 'over the 1.00 per-payment cap', 'ask', 'muted'),
          line('you', 'You, on your phone', 'approve', 'yes'),
          line('world', 'World ID: a verified human', 'bound to this exact payment', 'ok'),
          line('arc', 'Settled on Arc, co-signed', 'the approval is checked on-chain', '2.00'),
          line('store', 'Store', 'gate open', 'OPEN'),
        ] },
        { title: 'Revoke', amount: '', total: 'Budget <b>off</b>', lines: [
          line('you', 'You revoke the budget', 'one passkey signature', 'done'),
          line('arc', 'Arc disables the grant', 'tx 0x4f1ba8e1…8e02', 'ok'),
          line('robot', 'Next chai', 'the chip signs, Arc refuses: CannotUseADisabledDelegation', 'REFUSED', 'no'),
        ] },
      ]
      const stage = document.getElementById('stage')
      stage.innerHTML = receipts.map((r, i) => `
        <article class="receipt" id="r${i}">
          <header><h2>${r.title}</h2><span>${r.amount}</span></header>
          <ol>${r.lines.map((l) => `<li><span class="ic ${l.cls === 'no' ? 'no' : ''}">${ICONS[l.id]}</span><span class="what">${l.what}<small>${l.sub}</small></span><span class="val ${l.cls}">${l.val}</span></li>`).join('')}</ol>
          <footer><span>Duck Café · Arc mainnet</span><span>${r.total}</span></footer>
        </article>`).join('')
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
      const run = async () => {
        const cards = [...stage.querySelectorAll('.receipt')]
        for (;;) {
          cards.forEach((c) => c.querySelectorAll('li').forEach((li) => li.classList.remove('show')))
          for (const card of cards) {
            for (const li of card.querySelectorAll('li')) { li.classList.add('show'); await sleep(reduced ? 0 : 650) }
            await sleep(700)
          }
          await sleep(3500)
        }
      }
      run()
    </script>
  </body>
</html>
