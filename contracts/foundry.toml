# Vitaquack contracts (spec M1). The Arc Studio project is the single source of both contracts: studio/ is a pinned,
# read-only pull (studio/PULL.md) and this project builds, tests and deploys exactly those files. test/ (regression
# suite, golden vectors) and script/ (DeployArc, DeployZg) are the repo's own. Compiler settings equal Studio's
# foundry.toml: solc 0.8.23 (the Delegation Framework v1.3.0 pin), `paris`, optimizer 200 runs.
[profile.default]
src = "studio/contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.23"
auto_detect_solc = false
evm_version = "paris"
optimizer = true
optimizer_runs = 200
# Studio's CREATE2 helper for its own testnet deploys imports OpenZeppelin from Studio's node_modules; not used here.
skip = ["studio/contracts/script/**"]
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read", path = "./out/studio" }]
remappings = ["forge-std/=lib/forge-std/src/"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "preserve"
# The pulled Studio files are never rewritten here; change them in Studio and pull.
ignore = ["lib/**", "studio/**"]

[lint]
ignore = ["studio/**"]
