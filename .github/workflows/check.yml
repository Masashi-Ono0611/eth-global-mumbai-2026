name: Checks and deploy
on:
  # Branch pushes get their checks from the pull request; main runs on push (and deploys).
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Tried the playwright v1.64.1 container instead of `playwright install --with-deps` (2026-11-05): image start
    # (~33 s) plus installing unzip for setup-bun (~29 s) cost more than the ~39 s install it replaced.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        timeout-minutes: 5
      - run: bunx playwright install --with-deps chromium
      - run: bun run check
  # The app (alchemy.run.ts, stage `main`), after a green check on main only.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: app-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        timeout-minutes: 5
      # Edge serves apps/web/dist/client; Alchemy skips the website build when its sources are unchanged,
      # so a fresh checkout must build it first.
      - run: bun run build
      - run: bun run deploy --no-input --yes
        env:
          APP_RELEASE: ${{ github.sha }}
          APP_AUTH_SESSION_KEYS: ${{ secrets.APP_AUTH_SESSION_KEYS }}
          APP_RELAYER_PRIVATE_KEY: ${{ secrets.APP_RELAYER_PRIVATE_KEY }}
          APP_APPROVER_PRIVATE_KEY: ${{ secrets.APP_APPROVER_PRIVATE_KEY }}
          APP_GATE_ED25519_SEED: ${{ secrets.APP_GATE_ED25519_SEED }}
          APP_ARC_RPC_URL: ${{ secrets.APP_ARC_RPC_URL }}
          APP_ZG_API_KEY: ${{ secrets.APP_ZG_API_KEY }}
          APP_ZG_BASE_URL: ${{ secrets.APP_ZG_BASE_URL }}
          APP_ZG_MODEL: ${{ secrets.APP_ZG_MODEL }}
          APP_ZG_EXTRA_JSON: ${{ secrets.APP_ZG_EXTRA_JSON }}
          APP_WORLD_CLIENT_ID: ${{ secrets.APP_WORLD_CLIENT_ID }}
          APP_WORLD_CLIENT_SECRET: ${{ secrets.APP_WORLD_CLIENT_SECRET }}
          APP_WORLD_ISSUER: ${{ secrets.APP_WORLD_ISSUER }}
          APP_WORLD_STUB_JWK: ${{ secrets.APP_WORLD_STUB_JWK }}
          APP_ENFORCER_ADDRESS: ${{ secrets.APP_ENFORCER_ADDRESS }}
          APP_EPISODE_LOG_ADDRESS: ${{ secrets.APP_EPISODE_LOG_ADDRESS }}
          APP_EVIDENCE_TOKEN: ${{ secrets.APP_EVIDENCE_TOKEN }}
          APP_MERCHANT_PAY_TO: ${{ secrets.APP_MERCHANT_PAY_TO }}
          APP_RESTRICTED_PAY_TO: ${{ secrets.APP_RESTRICTED_PAY_TO }}
          APP_SCANS_ENABLED: ${{ secrets.APP_SCANS_ENABLED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
