name: Checks and deploy
on:
  # Branch pushes get their checks from the pull request; main runs on push (and deploys).
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Chromium and its system libraries come prebuilt with the image (matches the pinned playwright), instead of a
    # ~40 s `playwright install --with-deps` on every run.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        timeout-minutes: 5
      - run: bun run check
  # The app (alchemy.run.ts, stage `main`), after a green check on main only.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: app-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        timeout-minutes: 5
      # Edge serves apps/web/dist/client; Alchemy skips the website build when its sources are unchanged,
      # so a fresh checkout must build it first.
      - run: bun run build
      - run: bun run deploy --no-input --yes
        env:
          APP_RELEASE: ${{ github.sha }}
          APP_AUTH_SECRET: ${{ secrets.APP_AUTH_SECRET }}
          APP_AUTH_SESSION_KEYS: ${{ secrets.APP_AUTH_SESSION_KEYS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
